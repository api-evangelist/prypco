name: Prypco
description: >-
  PRYPCO is a Dubai-based PropTech platform building an integrated real estate
  ecosystem for the United Arab Emirates. Its products include Blocks (fractional
  property investment starting from AED 500), Mint (blockchain-based tokenized
  real estate buying, selling, and trading, run in partnership with the Dubai Land
  Department), Mortgage (instant pre-approval and mortgage comparison), Golden Visa
  application assistance, a general property buy/sell/rent management service, and
  One (an agent platform with listing and commission tooling). PRYPCO Real Estate
  LLC is registered in Dubai, UAE. The company operates a consumer web and mobile
  product surface and publishes no public developer API; this profile is a company
  identity record in the API Evangelist network, surfaced as a portfolio company of
  General Catalyst and awaiting any future developer/API surface.
